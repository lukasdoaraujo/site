<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:#050505;color:#F4EFE9;
    font-family:'Instrument Sans',sans-serif;line-height:1.7;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:28px;text-align:center;
  }
  .code{
    font-family:'Big Shoulders Display',sans-serif;font-weight:900;
    font-size:clamp(6rem,24vw,14rem);line-height:1;
    color:transparent;-webkit-text-stroke:2px rgba(217,194,176,.55);
  }
  h1{font-family:'Big Shoulders Display',sans-serif;font-weight:800;text-transform:uppercase;
    font-size:clamp(1.6rem,5vw,2.6rem);letter-spacing:1px;margin:18px 0 12px}
  p{color:rgba(244,239,233,.68);max-width:44ch;margin:0 auto 34px}
  .mono{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:#D9C2B0;display:block;margin-bottom:20px}
  .btn{
    display:inline-flex;align-items:center;gap:12px;
    font-weight:600;text-transform:uppercase;letter-spacing:1.5px;font-size:13px;
    padding:18px 32px;border-radius:2px;border:1px solid #D9C2B0;
    background:#D9C2B0;color:#050505;text-decoration:none;
    transition:background .25s,color .25s;
  }
  .btn:hover{background:transparent;color:#D9C2B0}
  .btn:focus-visible{outline:2px solid #F4EFE9;outline-offset:3px}
